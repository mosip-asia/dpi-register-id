# Base compose stack for register-id (Application + Redis)
# Works identically for local development, docker compose CLI, and remote deployment.

name: ${PROJECT_NAME}

services:
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ${PROJECT_NAME}:dev
    container_name: ${PROJECT_NAME}-app
    environment:
      PYTHONPATH: "/app/src"
      PROJECT_NAME: ${PROJECT_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      BUILD_VERSION: ${BUILD_VERSION}
      SOME_API_KEY: ${SOME_API_KEY}
      LOG_DIR: ${LOG_DIR}
      LOG_NAME: ${LOG_NAME}
      LOG_ROTATE_NAME: ${LOG_ROTATE_NAME}
      LOG_LEVEL: ${LOG_LEVEL}
      FASTAPI_HOST: "0.0.0.0"
      FASTAPI_PORT: 8000
      FASTAPI_WORKERS: ${FASTAPI_WORKERS}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      APPLICATION_STORE_KEY: ${APPLICATION_STORE_KEY}
      KEYCLOAK_OIDC_CLIENT_ID: ${KEYCLOAK_OIDC_CLIENT_ID}
      KEYCLOAK_OIDC_CLIENT_SECRET: ${KEYCLOAK_OIDC_CLIENT_SECRET}
      KEYCLOAK_OIDC_REDIRECT_URI: ${KEYCLOAK_OIDC_REDIRECT_URI}
      REGISTER_ID_COOKIE_SECURE: ${REGISTER_ID_COOKIE_SECURE}
      REGISTER_ID_OPERATOR_TOKEN: ${REGISTER_ID_OPERATOR_TOKEN}
      REGISTER_ID_OPERATOR_ROLE: ${REGISTER_ID_OPERATOR_ROLE}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      MOSIP_IDREPO_BASE_URL: ${MOSIP_IDREPO_BASE_URL}
      IDREPO_CLIENT_ID: ${IDREPO_CLIENT_ID}
      IDREPO_CLIENT_SECRET: ${IDREPO_CLIENT_SECRET}
      MOSIP_IDGENERATOR_BASE_URL: ${MOSIP_IDGENERATOR_BASE_URL}
      IDREPO_INPROCESS_FALLBACK: ${IDREPO_INPROCESS_FALLBACK}
      ENROLL_SUCCESS_LIMIT: ${ENROLL_SUCCESS_LIMIT}
      MOSIP_HTTP_TIMEOUT: ${MOSIP_HTTP_TIMEOUT}
      MOSIP_HTTP_RETRIES: ${MOSIP_HTTP_RETRIES}
      MOSIP_HTTP_BACKOFF_SECONDS: ${MOSIP_HTTP_BACKOFF_SECONDS}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DEBUG: ${DEBUG}
    volumes:
      - ./src/mock:/app/src/mock:ro
    ports:
      - "${FASTAPI_PORT}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  redis_data:
