[supervisord]
nodaemon=true
logfile = /dev/null
loglevel = debug

[supervisorctl]

[program:uvicorn]
command=register-id web start
process_name=%(program_name)s_%(process_num)s
numprocs=1
user=ubuntu

[program:celery]
command=register-id processor_celery start
process_name=%(program_name)s_%(process_num)s
numprocs=1
user=ubuntu
