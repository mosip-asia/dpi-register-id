# Local values for running the real MOSIP ID Repository next to register-id.
# In the Sandbox Kit these come from the config server, the global config map, and Secrets.
# Secrets here are read from environment variables passed to the container, never written in this file.

# --- Hosts
mosip.api.internal.host=localhost
mosip.api.public.host=localhost
keycloak.internal.url=http://keycloak:8080
keycloak.external.url=http://keycloak:8080

# --- Database (local Postgres from register-id compose)
mosip.idrepo.db.url=postgres
mosip.idrepo.db.port=5432
mosip.idrepo.db.identity.db-name=mosip_idrepo
mosip.idrepo.db.identity.username=idrepouser
mosip.idrepo.db.identity.password=${IDREPO_DB_PASSWORD}
mosip.idrepo.db.vid.db-name=mosip_idmap
mosip.idrepo.db.vid.username=idmapuser
mosip.idrepo.db.vid.password=${IDREPO_DB_PASSWORD}
db.dbuser.password=${IDREPO_DB_PASSWORD}
mosip.credential.service.database.hostname=postgres
mosip.credential.service.database.port=5432

# --- Neighbour MOSIP services (not running yet: these record what IDRepo calls)
mosip.kernel.keymanager.url=http://keymanager:8088
mosip.kernel.authmanager.url=http://authmanager:9191
mosip.kernel.masterdata.url=http://masterdata:8086
mosip.kernel.syncdata.url=http://syncdata:8089
mosip.kernel.idgenerator.url=http://idgenerator:8080
mosip.kernel.auditmanager.url=http://auditmanager:8081
mosip.idrepo.identity.url=http://idrepo-real:8090
mosip.idrepo.vid.url=http://idrepo-vid:8091
mosip.idrepo.credrequest.generator.url=http://credentialrequest:8094
mosip.idrepo.credential.service.url=http://credential:8095
mosip.pms.partnermanager.url=http://pms-partner:9090
mosip.websub.url=http://config-files:8000
mosip.biosdk.default.service.url=http://biosdk-service:9099/biosdk-service
mosip.mock.biosdk.url=http://biosdk-service:9099
mosip.kernel.xsdstorage-uri=http://config-files:8000/
mosip.idrepo.mosip-config-url=http://config-files:8000/

# --- Service identities (client_credentials against Keycloak via authmanager)
mosip.idrepo.auth.client-id=mosip-idrepo-client
mosip.idrepo.auth.app-id=idrepo
mosip.idrepo.auth.secret-key=${IDREPO_AUTH_SECRET}
mosip.idrepo.client.secret=${IDREPO_AUTH_SECRET}
mosip.idrepo.credential.auth.client-id=mosip-idrepo-client
mosip.idrepo.credential.auth.app-id=idrepo
mosip.idrepo.credential-req-generator.auth.client-id=mosip-idrepo-client
mosip.idrepo.credential-req-generator.auth.app-id=idrepo
mosip.idrepo.credential-req-generator.auth.secret-key=${IDREPO_AUTH_SECRET}
mosip.creser.client.secret=${IDREPO_AUTH_SECRET}
idrepo.websub.vid.credential.update.secret=${IDREPO_AUTH_SECRET}

# --- Salts and object store
mosip.kernel.uin.salt=${IDREPO_UIN_SALT}
mosip.kernel.partnercode.salt=${IDREPO_UIN_SALT}
s3.accesskey=${IDREPO_S3_ACCESS_KEY}
s3.secretkey=${IDREPO_S3_SECRET_KEY}
s3.region=

# --- Files the services download at startup (served by the config-files container)
config.server.file.storage.uri=http://config-files:8000/
mosip.kernel.config.server.file.storage.uri=http://config-files:8000/
spring.cloud.config.uri=http://config-files:8000

# --- Token check (local Keycloak 24 has no /auth path; MOSIP Keycloak does)
auth.server.admin.issuer.internal.uri=http://keycloak:8080/realms/
auth.server.admin.issuer.uri=http://keycloak:8080/realms/
auth-token-generator.rest.issuerUrl=http://keycloak:8080/realms/mosip
mosip.keycloak.issuerUrl=http://keycloak:8080/realms/mosip
# register-id-idrepo added so the register-id service account is accepted
auth.server.admin.allowed.audience=mosip-regproc-client,mosip-prereg-client,mosip-admin-client,mosip-crereq-client,mosip-creser-client,mosip-datsha-client,mosip-ida-client,mosip-resident-client,mosip-reg-client,mpartner-default-print,mosip-idrepo-client,mpartner-default-auth,mosip-syncdata-client,mosip-masterdata-client,mosip-idrepo-client,mosip-pms-client,mosip-hotlist-client,opencrvs-partner,mpartner-default-digitalcard,mpartner-default-mobile,mosip-signup-client,register-id-idrepo

# --- Object store for biometric documents (07b-run-object-store.sh)
object.store.s3.url=http://objectstore:8333
