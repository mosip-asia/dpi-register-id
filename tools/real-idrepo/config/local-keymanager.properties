# Keymanager only: a PKCS12 file keystore instead of SoftHSM/PKCS11 (MOSIP supports both).
# The file is created under mosip-local/keystore/. Its password comes from idrepo.env.
mosip.kernel.keymanager.hsm.keystore-type=PKCS12
mosip.kernel.keymanager.hsm.config-path=/keystore/keystore.p12
mosip.kernel.keymanager.hsm.keystore-pass=${IDREPO_KEYSTORE_PIN}
mosip.kernel.tokenid.uin.salt=${IDREPO_UIN_SALT}
mosip.kernel.tokenid.partnercode.salt=${IDREPO_UIN_SALT}
