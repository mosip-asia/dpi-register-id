# Extra local values for MOSIP kernel services (masterdata, keymanager). Passed as -D options,
# together with config/local.properties. Secrets come from idrepo.env.

mosip.kernel.database.hostname=postgres
mosip.kernel.database.port=5432
db.dbuser.password=${IDREPO_DB_PASSWORD}

mosip.api.internal.url=http://localhost
mosip.iam.base.url=http://keycloak:8080
mosip.authmanager.base-url=http://authmanager:9191/v1/authmanager
mosip.kernel.notification.url=http://notifier:8083
mosip.kernel.otpmanager.url=http://otpmanager:8085
mosip.kernel.syncdata.syncjob.url=http://syncjob:8089

mosip.country.code=LOC
mosip.mandatory-languages=eng
mosip.optional-languages=
mosip.left_to_right_orientation=eng
mosip.right_to_left_orientation=
mosip.recommended.centers.locCode=1
mosip.kernel.filtervalue.max_columns=20
aplication.configuration.level.version=LTS

mosip.admin.client.secret=${IDREPO_AUTH_SECRET}
mosip.auth.client.secret=${IDREPO_AUTH_SECRET}
mosip.ida.client.secret=${IDREPO_AUTH_SECRET}
mosip.prereg.client.secret=${IDREPO_AUTH_SECRET}
mosip.reg.client.secret=${IDREPO_AUTH_SECRET}
keycloak.admin.password=${IDREPO_AUTH_SECRET}

sms.authkey=local
sms.gateway.provider=local
sms.host=localhost
sms.port=25
smtp.host=localhost
smtp.port=25
smtp.username=local
smtp.secret=local
softhsm.kernel.security.pin=${IDREPO_KEYSTORE_PIN}
softhsm.security.pin=${IDREPO_KEYSTORE_PIN}
