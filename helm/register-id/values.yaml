## Labels applied to every resource. Matches other MOSIP charts.
commonLabels:
  app.kubernetes.io/component: mosip

commonAnnotations: {}

replicaCount: 1

## CI still pushes ghcr.io/mosip-asia/dpi-register-id. The Kit cannot pull GHCR
## anonymously. Set registry, repository, and digest to the mirrored copy
## (Docker Hub or another registry the Kit can pull). image.digest is required.
image:
  registry: ghcr.io
  repository: mosip-asia/dpi-register-id
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

## Public host the Sandbox Kit routes. This chart does not render an Ingress.
## Host is <hostname>.<domain>, one label under the environment domain.
## register.id.<domain> is rejected by the Sandbox Kit.
## sandbox.example.net -> register.sandbox.example.net
publicHost:
  hostname: register
  domain: ""
  ## Full host. When set, hostname and domain are ignored.
  host: ""

## Every value below is empty until the deploy sets it. The Deployment
## fails the render when any of them is missing.
projectName: ""
environment: ""
buildVersion: ""
logLevel: ""
debug: ""
allowedHosts: ""
fastapiWorkers: ""
## true or false. The app does not infer this from ENVIRONMENT.
cookieSecure: ""
## reader or custodian.
operatorRole: ""

## Non-secret MOSIP endpoints. Secrets stay in existingSecret.
mosip:
  idrepoBaseUrl: ""
  httpTimeout: ""
  httpRetries: ""
  httpBackoffSeconds: ""
  idgeneratorBaseUrl: ""
  ## false on a Kit deploy. true is the local mock path.
  inprocessFallback: ""
  enrollSuccessLimit: ""

keycloak:
  ## Browser host, iam.<domain>. url and internalUrl must both be set and should differ.
  url: ""
  ## In-cluster host for token and admin calls. Must be set with url, and should differ from it.
  internalUrl: ""
  realm: ""
  adminClientId: ""
  ## Confidential client for the IDRepo service token. No default.
  ## IDREPO_CLIENT_SECRET is a key in existingSecret, never a value in this file.
  idrepoClientId: ""
  oidcClientId: ""
  ## https://register.<domain>/api/login/callback
  redirectUri: ""

## Mail. Required. Use off to leave the container value empty, which skips sending.
## A real provider, sender, host, or user is passed through unchanged.
email:
  provider: ""
  from: ""
smtp:
  host: ""
  port: ""
  user: ""
  starttls: ""

## Secret keys the Kit supplies. The chart does not render secret values.
## Each key below is a required secretKeyRef. The value may be empty when the
## feature is off (OIDC public client, operator token, mail password).
## REDIS_URL, APPLICATION_STORE_KEY, DJANGO_SECRET_KEY,
## IDREPO_CLIENT_SECRET, KEYCLOAK_ADMIN_CLIENT_SECRET,
## KEYCLOAK_OIDC_CLIENT_SECRET, REGISTER_ID_OPERATOR_TOKEN,
## EMAIL_PASSWORD, SMTP_PASSWORD
existingSecret: ""

## Extra environment entries, each {name, value} or {name, valueFrom}.
extraEnv: []

## Same shape as extraEnv. The Sandbox Kit sets this key. Both lists are applied.
extraEnvVars: []

## Kit pod securityContext. Applied with podSecurityContext.
## On a duplicate key, securityContext wins. containerSecurityContext is unchanged.
securityContext: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

livenessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  path: /ready
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
