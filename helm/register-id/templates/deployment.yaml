apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "register-id.fullname" . }}
  labels:
    {{- include "register-id.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "register-id.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "register-id.selectorLabels" . | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Kit securityContext overlays podSecurityContext; duplicate keys use the Kit value. */}}
      {{- $podCtx := dict }}
      {{- range $key, $val := (default (dict) .Values.podSecurityContext) }}
      {{- $_ := set $podCtx $key $val }}
      {{- end }}
      {{- range $key, $val := (default (dict) .Values.securityContext) }}
      {{- $_ := set $podCtx $key $val }}
      {{- end }}
      securityContext:
        {{- toYaml $podCtx | nindent 8 }}
      containers:
        - name: register-id
          image: {{ include "register-id.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: PROJECT_NAME
              value: {{ required "projectName is required" .Values.projectName | quote }}
            - name: ENVIRONMENT
              value: {{ required "environment is required" .Values.environment | quote }}
            - name: BUILD_VERSION
              value: {{ required "buildVersion is required" .Values.buildVersion | quote }}
            - name: LOG_LEVEL
              value: {{ required "logLevel is required" .Values.logLevel | quote }}
            - name: FASTAPI_HOST
              value: "0.0.0.0"
            - name: FASTAPI_PORT
              value: "8000"
            - name: FASTAPI_WORKERS
              value: {{ required "fastapiWorkers is required" .Values.fastapiWorkers | quote }}
            - name: DEBUG
              value: {{ required "debug is required" .Values.debug | quote }}
            - name: ALLOWED_HOSTS
              value: {{ required "allowedHosts is required" .Values.allowedHosts | quote }}
            - name: IDREPO_INPROCESS_FALLBACK
              value: {{ required "mosip.inprocessFallback is required" .Values.mosip.inprocessFallback | quote }}
            - name: MOSIP_IDREPO_BASE_URL
              value: {{ required "mosip.idrepoBaseUrl is required" .Values.mosip.idrepoBaseUrl | quote }}
            - name: MOSIP_IDGENERATOR_BASE_URL
              value: {{ required "mosip.idgeneratorBaseUrl is required" .Values.mosip.idgeneratorBaseUrl | quote }}
            - name: MOSIP_HTTP_TIMEOUT
              value: {{ required "mosip.httpTimeout is required" .Values.mosip.httpTimeout | quote }}
            - name: MOSIP_HTTP_RETRIES
              value: {{ required "mosip.httpRetries is required" .Values.mosip.httpRetries | quote }}
            - name: MOSIP_HTTP_BACKOFF_SECONDS
              value: {{ required "mosip.httpBackoffSeconds is required" .Values.mosip.httpBackoffSeconds | quote }}
            - name: ENROLL_SUCCESS_LIMIT
              value: {{ required "mosip.enrollSuccessLimit is required" .Values.mosip.enrollSuccessLimit | quote }}
            - name: KEYCLOAK_PUBLIC_URL
              value: {{ required "keycloak.url is required" .Values.keycloak.url | quote }}
            - name: KEYCLOAK_INTERNAL_URL
              value: {{ required "keycloak.internalUrl is required" .Values.keycloak.internalUrl | quote }}
            - name: KEYCLOAK_URL
              value: {{ required "keycloak.url is required" .Values.keycloak.url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ required "keycloak.realm is required" .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: {{ required "keycloak.adminClientId is required" .Values.keycloak.adminClientId | quote }}
            - name: IDREPO_CLIENT_ID
              value: {{ required "keycloak.idrepoClientId is required" .Values.keycloak.idrepoClientId | quote }}
            - name: KEYCLOAK_OIDC_CLIENT_ID
              value: {{ required "keycloak.oidcClientId is required" .Values.keycloak.oidcClientId | quote }}
            - name: KEYCLOAK_OIDC_REDIRECT_URI
              value: {{ required "keycloak.redirectUri is required" .Values.keycloak.redirectUri | quote }}
            - name: REGISTER_ID_COOKIE_SECURE
              value: {{ required "cookieSecure is required" .Values.cookieSecure | quote }}
            - name: REGISTER_ID_OPERATOR_ROLE
              value: {{ required "operatorRole is required" .Values.operatorRole | quote }}
            - name: EMAIL_PROVIDER
              value: {{ include "register-id.requiredEnv" (dict "message" "email.provider is required" "value" .Values.email.provider) | quote }}
            - name: EMAIL_FROM
              value: {{ include "register-id.requiredEnv" (dict "message" "email.from is required" "value" .Values.email.from) | quote }}
            - name: SMTP_HOST
              value: {{ include "register-id.requiredEnv" (dict "message" "smtp.host is required" "value" .Values.smtp.host) | quote }}
            - name: SMTP_PORT
              value: {{ required "smtp.port is required" .Values.smtp.port | quote }}
            - name: SMTP_USER
              value: {{ include "register-id.requiredEnv" (dict "message" "smtp.user is required" "value" .Values.smtp.user) | quote }}
            - name: SMTP_STARTTLS
              value: {{ required "smtp.starttls is required" .Values.smtp.starttls | quote }}
            {{- $secretName := required "existingSecret is required" .Values.existingSecret }}
            {{- range $key := list "REDIS_URL" "APPLICATION_STORE_KEY" "DJANGO_SECRET_KEY" "IDREPO_CLIENT_SECRET" "KEYCLOAK_ADMIN_CLIENT_SECRET" "KEYCLOAK_OIDC_CLIENT_SECRET" "REGISTER_ID_OPERATOR_TOKEN" "EMAIL_PASSWORD" "SMTP_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
