[project]
name = "register-id"
version = "0.1.0"
description = "DPI Citizen Registration Gateway (register.id) for MOSIP Asia"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=6.0.4",
    "django-stubs[compatible-mypy]>=6.0.3",
    "fastapi>=0.136.1",
    "jinja2>=3.1.6",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "psycopg2-binary>=2.9.10",
    "pytest-coverage>=0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "scikit-learn>=1.8.0",
    "typer>=0.25.0",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.3.0",
    "httpx>=0.28.0",
    "ipykernel>=6.30.1",
    "mypy>=1.20.2",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "types-requests>=2.32.0.20241016",
]

[tool.uv]
package = true

[project.scripts]
register-id = "project:cli"


